<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reminders</title>
<style>
:root{--cc-green:#2e8540;--cc-green-dark:#1f5c2d;--cc-green-tint:#eaf6ec;--cc-green-tint-strong:#f1f8f2;--cc-bg:#f4f6f4;--cc-surface:#ffffff;--cc-surface-dim:#f8f8f8;--cc-border:#e0e4e0;--cc-text:#1c1c1c;--cc-text-sub:#666666;--cc-text-faint:#8a8a8a;--cc-danger:#d32f2f;--cc-danger-dark:#b42318;--cc-danger-tint:#fdecec;--cc-success:#2e7d32;--cc-success-tint:#eaf6ec;--cc-info:#4c8bd9;--cc-grad-primary:linear-gradient(135deg,#4b8b62,#2e8540);--cc-grad-medicines:linear-gradient(135deg,#558f6a,#3f7e58);--cc-grad-schedule:linear-gradient(135deg,#5a9670,#4b8b62);--cc-grad-sos:linear-gradient(90deg,#f24141,#d62323);--cc-pastel-blue:#e3f2fd;--cc-pastel-blue-fg:#1565c0;--cc-pastel-purple:#f3e5f5;--cc-pastel-purple-fg:#6a1b9a;--cc-pastel-green:#e8f5e9;--cc-pastel-green-fg:#2e7d32;--cc-pastel-amber:#fff8e1;--cc-pastel-amber-fg:#6b4d00;--cc-pastel-red:#ffebee;--cc-pastel-red-fg:#c62828;--cc-pastel-teal:#e0f2f1;--cc-pastel-teal-fg:#00695c;--cc-radius-md:14px;--cc-radius-xl:20px;--cc-radius-3xl:24px;--cc-shadow-card:0 4px 16px rgba(0,0,0,.06);--cc-shadow-raised:0 6px 20px rgba(0,0,0,.08);--cc-font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{margin:0;background:#e9ece9;display:flex;justify-content:center;padding:24px 0;font-family:var(--cc-font);color:var(--cc-text)}
.phone{width:393px;min-height:852px;background:var(--cc-bg);border-radius:28px;overflow:hidden;box-shadow:0 10px 40px rgba(0,0,0,.15);display:flex;flex-direction:column;position:relative}
.header{background:var(--cc-grad-primary);color:#fff;padding:0 20px 22px}
.statusbar{display:flex;justify-content:space-between;align-items:center;padding:14px 2px 10px;font-size:14px;font-weight:600}
.statusbar .dots{display:flex;gap:5px}
.statusbar .dots span{width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.9}
.header-row{display:flex;align-items:center;gap:14px;margin-top:8px}
.back-btn{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;flex:none}
.header-title{font-size:20px;font-weight:700}
.header-sub{font-size:13px;color:rgba(255,255,255,.8);margin-top:2px}
.content{flex:1;padding:16px 20px 90px;display:flex;flex-direction:column;gap:14px}
.cat-row{display:flex;gap:8px;overflow:hidden;padding-bottom:2px}
.cat-chip{height:36px;padding:0 14px;border-radius:18px;display:flex;align-items:center;gap:5px;font-size:13px;font-weight:600;background:var(--cc-surface);border:1px solid var(--cc-border);color:var(--cc-text-sub);white-space:nowrap;flex:none}
.cat-chip.sel{background:var(--cc-green);border-color:var(--cc-green);color:#fff}
.rem-card{background:var(--cc-surface);border-radius:var(--cc-radius-xl);box-shadow:var(--cc-shadow-card);min-height:76px;padding:14px 16px;display:flex;align-items:center;gap:14px}
.rem-icon{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none}
.rem-main{flex:1;min-width:0}
.rem-title{font-size:15px;font-weight:600;display:flex;align-items:center;gap:8px}
.rem-sub{font-size:12px;color:var(--cc-text-sub);margin-top:3px}
.tag-chip{font-size:10px;font-weight:700;background:var(--cc-pastel-purple);color:var(--cc-pastel-purple-fg);border-radius:999px;padding:3px 8px}
.toggle{width:42px;height:24px;border-radius:12px;background:var(--cc-green);position:relative;flex:none}
.toggle::after{content:"";position:absolute;top:3px;right:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.toggle.off{background:#cfd4cf}
.toggle.off::after{right:auto;left:3px}
.fab{position:absolute;right:20px;bottom:96px;width:56px;height:56px;border-radius:50%;background:var(--cc-grad-primary);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:var(--cc-shadow-raised)}
.bottomnav{background:var(--cc-surface);border-top:1px solid var(--cc-border);display:flex;padding:10px 0 18px;position:absolute;left:0;right:0;bottom:0}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:600;color:var(--cc-text-faint)}
.nav-item.active{color:var(--cc-green)}
</style>
</head>
<body>
<div class="phone">
  <div class="header">
    <div class="statusbar">
      <span>9:41</span>
      <span class="dots"><span></span><span></span><span></span></span>
    </div>
    <div class="header-row">
      <div class="back-btn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
      </div>
      <div>
        <div class="header-title">Reminders</div>
        <div class="header-sub">Sunita Sharma</div>
      </div>
    </div>
  </div>

  <div class="content">
    <div class="cat-row">
      <span class="cat-chip sel">All</span>
      <span class="cat-chip">💊 Medicine</span>
      <span class="cat-chip">💧 Water</span>
      <span class="cat-chip">🚶 Walk</span>
      <span class="cat-chip">❤️ Vitals</span>
      <span class="cat-chip">+ Custom</span>
    </div>

    <div class="rem-card">
      <div class="rem-icon" style="background:var(--cc-pastel-teal);color:var(--cc-pastel-teal-fg)">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/></svg>
      </div>
      <div class="rem-main">
        <div class="rem-title">Drink Water</div>
        <div class="rem-sub">Every 2 hours &middot; 8 AM&ndash;8 PM</div>
      </div>
      <div class="toggle"></div>
    </div>

    <div class="rem-card">
      <div class="rem-icon" style="background:var(--cc-pastel-green);color:var(--cc-pastel-green-fg)">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="13" cy="4" r="2"/><path d="M13 8l-3 4 3 3v5"/><path d="M10 12l-3 2-2 6"/><path d="M13 11l4 1 3 4"/></svg>
      </div>
      <div class="rem-main">
        <div class="rem-title">Morning Walk</div>
        <div class="rem-sub">Daily &middot; 6:30 AM</div>
      </div>
      <div class="toggle"></div>
    </div>

    <div class="rem-card">
      <div class="rem-icon" style="background:var(--cc-pastel-red);color:var(--cc-pastel-red-fg)">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
      </div>
      <div class="rem-main">
        <div class="rem-title">Check Blood Pressure</div>
        <div class="rem-sub">Mon &amp; Thu &middot; 9:00 AM</div>
      </div>
      <div class="toggle"></div>
    </div>

    <div class="rem-card">
      <div class="rem-icon" style="background:var(--cc-pastel-purple);color:var(--cc-pastel-purple-fg)">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
      </div>
      <div class="rem-main">
        <div class="rem-title">Evening Bhajan <span class="tag-chip">Custom</span></div>
        <div class="rem-sub">Daily &middot; 7:00 PM</div>
      </div>
      <div class="toggle off"></div>
    </div>
  </div>

  <div class="fab">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
  </div>

  <div class="bottomnav">
    <div class="nav-item active">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      Home
    </div>
    <div class="nav-item">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
      Alerts
    </div>
    <div class="nav-item">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      Settings
    </div>
  </div>
</div>
</body>
</html>
