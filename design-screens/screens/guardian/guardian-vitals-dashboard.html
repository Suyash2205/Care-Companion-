<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Health Vitals</title>
<style>
:root{--cc-green:#2e8540;--cc-green-dark:#1f5c2d;--cc-green-tint:#eaf6ec;--cc-green-tint-strong:#f1f8f2;--cc-bg:#f4f6f4;--cc-surface:#ffffff;--cc-surface-dim:#f8f8f8;--cc-border:#e0e4e0;--cc-text:#1c1c1c;--cc-text-sub:#666666;--cc-text-faint:#8a8a8a;--cc-danger:#d32f2f;--cc-danger-dark:#b42318;--cc-danger-tint:#fdecec;--cc-success:#2e7d32;--cc-success-tint:#eaf6ec;--cc-info:#4c8bd9;--cc-grad-primary:linear-gradient(135deg,#4b8b62,#2e8540);--cc-grad-medicines:linear-gradient(135deg,#558f6a,#3f7e58);--cc-grad-schedule:linear-gradient(135deg,#5a9670,#4b8b62);--cc-grad-sos:linear-gradient(90deg,#f24141,#d62323);--cc-pastel-blue:#e3f2fd;--cc-pastel-blue-fg:#1565c0;--cc-pastel-purple:#f3e5f5;--cc-pastel-purple-fg:#6a1b9a;--cc-pastel-green:#e8f5e9;--cc-pastel-green-fg:#2e7d32;--cc-pastel-amber:#fff8e1;--cc-pastel-amber-fg:#6b4d00;--cc-pastel-red:#ffebee;--cc-pastel-red-fg:#c62828;--cc-pastel-teal:#e0f2f1;--cc-pastel-teal-fg:#00695c;--cc-radius-md:14px;--cc-radius-xl:20px;--cc-radius-3xl:24px;--cc-shadow-card:0 4px 16px rgba(0,0,0,.06);--cc-shadow-raised:0 6px 20px rgba(0,0,0,.08);--cc-font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{margin:0;background:#e9ece9;display:flex;justify-content:center;padding:24px 0;font-family:var(--cc-font);color:var(--cc-text)}
.phone{width:393px;min-height:852px;background:var(--cc-bg);border-radius:28px;overflow:hidden;box-shadow:0 10px 40px rgba(0,0,0,.15);display:flex;flex-direction:column}
.header{background:var(--cc-grad-primary);color:#fff;padding:0 20px 22px}
.statusbar{display:flex;justify-content:space-between;align-items:center;padding:14px 2px 10px;font-size:14px;font-weight:600}
.statusbar .dots{display:flex;gap:5px}
.statusbar .dots span{width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.9}
.header-row{display:flex;align-items:center;gap:14px;margin-top:8px}
.back-btn{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;flex:none}
.header-titles{flex:1}
.header-title{font-size:20px;font-weight:700}
.header-sub{font-size:13px;color:rgba(255,255,255,.8);margin-top:2px}
.export-btn{display:flex;align-items:center;gap:6px;border:1.4px solid rgba(255,255,255,.7);border-radius:999px;padding:7px 12px;font-size:12px;font-weight:700;color:#fff;flex:none}
.content{flex:1;padding:16px 20px 24px;display:flex;flex-direction:column;gap:14px}
.stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat-card{background:var(--cc-surface);border-radius:var(--cc-radius-md);box-shadow:var(--cc-shadow-card);padding:12px 10px;display:flex;flex-direction:column;align-items:center;gap:6px}
.stat-label{font-size:11px;font-weight:700;letter-spacing:.05em;color:var(--cc-text-faint)}
.stat-value{font-size:20px;font-weight:700}
.pill{font-size:10.5px;font-weight:700;border-radius:999px;padding:3px 10px}
.pill.ok{background:var(--cc-success-tint);color:var(--cc-success)}
.pill.high{background:var(--cc-danger-tint);color:var(--cc-danger)}
.pill.mid{background:var(--cc-pastel-amber);color:var(--cc-pastel-amber-fg)}
.tabs{background:var(--cc-surface);border-radius:var(--cc-radius-md);box-shadow:var(--cc-shadow-card);display:flex}
.tab{flex:1;text-align:center;padding:13px 4px;font-size:13px;font-weight:600;color:var(--cc-text-sub);position:relative}
.tab.active{color:var(--cc-green);font-weight:700}
.tab.active::after{content:"";position:absolute;left:18%;right:18%;bottom:0;height:3px;border-radius:3px 3px 0 0;background:var(--cc-green)}
.filter-row{display:flex;gap:8px}
.filter-chip{padding:7px 16px;border-radius:999px;font-size:12.5px;font-weight:600;background:var(--cc-surface);border:1px solid var(--cc-border);color:var(--cc-text-sub)}
.filter-chip.sel{background:var(--cc-green);border-color:var(--cc-green);color:#fff}
.hist-card{background:var(--cc-surface);border-radius:var(--cc-radius-md);box-shadow:var(--cc-shadow-card);min-height:64px;padding:12px 14px;display:flex;align-items:center;gap:12px}
.trend{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none}
.trend.down{background:var(--cc-success-tint);color:var(--cc-success)}
.trend.up{background:var(--cc-danger-tint);color:var(--cc-danger)}
.trend.flat{background:var(--cc-surface-dim);color:var(--cc-text-sub)}
.hist-main{flex:1;min-width:0}
.hist-value{font-size:16px;font-weight:700}
.hist-meta{font-size:12px;color:var(--cc-text-sub);margin-top:2px;display:flex;align-items:center;gap:8px}
.by-chip{font-size:11px;color:var(--cc-text-faint);background:var(--cc-surface-dim);border-radius:999px;padding:2px 8px}
</style>
</head>
<body>
<div class="phone">
  <div class="header">
    <div class="statusbar">
      <span>9:41</span>
      <span class="dots"><span></span><span></span><span></span></span>
    </div>
    <div class="header-row">
      <div class="back-btn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
      </div>
      <div class="header-titles">
        <div class="header-title">Health Vitals</div>
        <div class="header-sub">Sunita Sharma</div>
      </div>
      <div class="export-btn">
        PDF
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        Export
      </div>
    </div>
  </div>

  <div class="content">
    <div class="stat-row">
      <div class="stat-card">
        <div class="stat-label">BP</div>
        <div class="stat-value">120/80</div>
        <span class="pill ok">Normal</span>
      </div>
      <div class="stat-card">
        <div class="stat-label">SUGAR</div>
        <div class="stat-value">165</div>
        <span class="pill high">High</span>
      </div>
      <div class="stat-card">
        <div class="stat-label">TEMP</div>
        <div class="stat-value">98.6&deg;F</div>
        <span class="pill ok">Normal</span>
      </div>
    </div>

    <div class="tabs">
      <div class="tab active">Blood Pressure</div>
      <div class="tab">Sugar</div>
      <div class="tab">Temperature</div>
    </div>

    <div class="filter-row">
      <span class="filter-chip sel">Week</span>
      <span class="filter-chip">Month</span>
      <span class="filter-chip">All</span>
    </div>

    <div class="hist-card">
      <div class="trend down">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 18 13.5 8.5 8.5 13.5 1 6"/><polyline points="17 18 23 18 23 12"/></svg>
      </div>
      <div class="hist-main">
        <div class="hist-value">128/84</div>
        <div class="hist-meta">Today 9:41 AM <span class="by-chip">by Sunita</span></div>
      </div>
      <span class="pill ok">Normal</span>
    </div>

    <div class="hist-card">
      <div class="trend up">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>
      </div>
      <div class="hist-main">
        <div class="hist-value">142/95</div>
        <div class="hist-meta">Yesterday 8:15 PM <span class="by-chip">by Raj</span></div>
      </div>
      <span class="pill mid">Borderline</span>
    </div>

    <div class="hist-card">
      <div class="trend flat">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
      </div>
      <div class="hist-main">
        <div class="hist-value">120/80</div>
        <div class="hist-meta">Mon 9:02 AM <span class="by-chip">by Sunita</span></div>
      </div>
      <span class="pill ok">Normal</span>
    </div>

    <div class="hist-card">
      <div class="trend up">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>
      </div>
      <div class="hist-main">
        <div class="hist-value">155/102</div>
        <div class="hist-meta">Sun 9:30 PM <span class="by-chip">by Raj</span></div>
      </div>
      <span class="pill high">High</span>
    </div>
  </div>
</div>
</body>
</html>
