<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alert Sent — CareCompanion</title>
<style>
:root{--cc-green:#2e8540;--cc-green-dark:#1f5c2d;--cc-green-tint:#eaf6ec;--cc-green-tint-strong:#f1f8f2;--cc-bg:#f4f6f4;--cc-surface:#ffffff;--cc-surface-dim:#f8f8f8;--cc-border:#e0e4e0;--cc-text:#1c1c1c;--cc-text-sub:#666666;--cc-text-faint:#8a8a8a;--cc-danger:#d32f2f;--cc-danger-dark:#b42318;--cc-danger-tint:#fdecec;--cc-success:#2e7d32;--cc-success-tint:#eaf6ec;--cc-info:#4c8bd9;--cc-grad-primary:linear-gradient(135deg,#4b8b62,#2e8540);--cc-grad-sos:linear-gradient(90deg,#f24141,#d62323);--cc-pastel-blue:#e3f2fd;--cc-pastel-blue-fg:#1565c0;--cc-pastel-purple:#f3e5f5;--cc-pastel-purple-fg:#6a1b9a;--cc-pastel-green:#e8f5e9;--cc-pastel-green-fg:#2e7d32;--cc-pastel-amber:#fff8e1;--cc-pastel-amber-fg:#6b4d00;--cc-pastel-red:#ffebee;--cc-pastel-red-fg:#c62828;--cc-pastel-teal:#e0f2f1;--cc-pastel-teal-fg:#00695c;--cc-radius-md:14px;--cc-radius-xl:20px;--cc-radius-3xl:24px;--cc-shadow-card:0 4px 16px rgba(0,0,0,.06);--cc-shadow-raised:0 6px 20px rgba(0,0,0,.08);--cc-shadow-sos:0 8px 24px rgba(211,47,47,.35);--cc-font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{margin:0;background:#e9ece9;display:flex;justify-content:center;padding:24px 0;font-family:var(--cc-font)}
.phone{width:393px;min-height:852px;background:var(--cc-bg);border-radius:28px;overflow:hidden;box-shadow:0 10px 40px rgba(0,0,0,.15);position:relative;display:flex;flex-direction:column;font-family:var(--cc-font)}
.statusbar{display:flex;justify-content:space-between;align-items:center;padding:14px 24px 6px;color:#4a4a4a;font-size:15px;font-weight:600}
.statusbar .dots{display:flex;align-items:center;gap:7px}
.statusbar .dot{width:9px;height:9px;border-radius:50%;background:#4a4a4a}
.statusbar .batt{width:24px;height:12px;border:1.8px solid #4a4a4a;border-radius:3px;position:relative}
.statusbar .batt::after{content:"";position:absolute;left:1.5px;top:1.5px;bottom:1.5px;width:70%;background:#4a4a4a;border-radius:1px}
.content{flex:1;padding:24px 24px 32px;display:flex;flex-direction:column;align-items:center;text-align:center}
.check-wrap{width:140px;height:140px;border-radius:50%;background:var(--cc-green-tint-strong);display:flex;align-items:center;justify-content:center;margin-top:44px}
.check-mid{width:112px;height:112px;border-radius:50%;background:var(--cc-green-tint);display:flex;align-items:center;justify-content:center}
.check-core{width:84px;height:84px;border-radius:50%;background:var(--cc-success);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:var(--cc-shadow-raised)}
.check-core svg{width:44px;height:44px}
h1{font-size:38px;font-weight:800;color:var(--cc-text);margin-top:26px}
.sub{font-size:22px;color:var(--cc-text-sub);margin-top:8px}
.card{width:100%;background:var(--cc-surface);border-radius:var(--cc-radius-xl);box-shadow:var(--cc-shadow-card);padding:8px 20px;margin-top:28px;text-align:left}
.row{display:flex;align-items:center;gap:14px;padding:18px 0;font-size:18px;color:var(--cc-text)}
.row + .row{border-top:1px solid var(--cc-border)}
.row .tick{flex:none;width:32px;height:32px;border-radius:50%;background:var(--cc-success-tint);color:var(--cc-success);display:flex;align-items:center;justify-content:center}
.row .tick svg{width:18px;height:18px}
.btn-call{margin-top:auto;width:100%;height:96px;background:var(--cc-grad-primary);color:#fff;font-size:28px;font-weight:800;font-family:var(--cc-font);border:none;border-radius:var(--cc-radius-xl);box-shadow:var(--cc-shadow-raised);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:14px}
.btn-call svg{width:32px;height:32px}
.btn-cancel{margin-top:16px;width:100%;height:72px;background:var(--cc-surface);color:var(--cc-danger);font-size:22px;font-weight:800;font-family:var(--cc-font);border:2px solid var(--cc-danger);border-radius:var(--cc-radius-xl);box-shadow:var(--cc-shadow-card);cursor:pointer}
</style>
</head>
<body>
<div class="phone">
  <div class="statusbar">
    <span>9:41</span>
    <span class="dots">
      <span class="dot"></span><span class="dot"></span><span class="dot"></span>
      <span class="batt"></span>
    </span>
  </div>
  <div class="content">
    <div class="check-wrap"><div class="check-mid"><div class="check-core">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
    </div></div></div>
    <h1>Alert Sent!</h1>
    <div class="sub">Your family has been notified</div>

    <div class="card">
      <div class="row">
        <span class="tick"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></span>
        SMS with location sent to 3 emergency contacts
      </div>
      <div class="row">
        <span class="tick"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></span>
        Location shared — Mira Road, Mumbai
      </div>
    </div>

    <button class="btn-call">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
      Call Aarav (Son)
    </button>
    <button class="btn-cancel">Cancel Alert — I am safe</button>
  </div>
</div>
</body>
</html>
