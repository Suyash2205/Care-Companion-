<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Health Readings</title>
<style>
:root{--cc-green:#2e8540;--cc-green-dark:#1f5c2d;--cc-green-tint:#eaf6ec;--cc-green-tint-strong:#f1f8f2;--cc-bg:#f4f6f4;--cc-surface:#ffffff;--cc-surface-dim:#f8f8f8;--cc-border:#e0e4e0;--cc-text:#1c1c1c;--cc-text-sub:#666666;--cc-text-faint:#8a8a8a;--cc-danger:#d32f2f;--cc-danger-dark:#b42318;--cc-danger-tint:#fdecec;--cc-success:#2e7d32;--cc-success-tint:#eaf6ec;--cc-info:#4c8bd9;--cc-grad-primary:linear-gradient(135deg,#4b8b62,#2e8540);--cc-grad-sos:linear-gradient(90deg,#f24141,#d62323);--cc-pastel-blue:#e3f2fd;--cc-pastel-blue-fg:#1565c0;--cc-pastel-purple:#f3e5f5;--cc-pastel-purple-fg:#6a1b9a;--cc-pastel-green:#e8f5e9;--cc-pastel-green-fg:#2e7d32;--cc-pastel-amber:#fff8e1;--cc-pastel-amber-fg:#6b4d00;--cc-pastel-red:#ffebee;--cc-pastel-red-fg:#c62828;--cc-pastel-pink:#fce4ec;--cc-pastel-pink-fg:#ad1457;--cc-pastel-teal:#e0f2f1;--cc-pastel-teal-fg:#00695c;--cc-radius-md:14px;--cc-radius-xl:20px;--cc-radius-3xl:24px;--cc-shadow-card:0 4px 16px rgba(0,0,0,.06);--cc-shadow-raised:0 6px 20px rgba(0,0,0,.08);--cc-font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:#e9ece9;display:flex;justify-content:center;padding:24px 0;font-family:var(--cc-font);color:var(--cc-text)}
.phone{width:393px;min-height:852px;background:var(--cc-bg);border-radius:28px;overflow:hidden;box-shadow:0 10px 40px rgba(0,0,0,.15);position:relative;display:flex;flex-direction:column}
.statusbar{display:flex;justify-content:space-between;align-items:center;padding:12px 22px 6px;color:#3a3a3a;font-size:15px;font-weight:600}
.statusbar .dots{display:flex;gap:6px;align-items:center}
.statusbar .dot{width:9px;height:9px;border-radius:50%;background:#3a3a3a}
.statusbar .batt{width:22px;height:11px;border:1.8px solid #3a3a3a;border-radius:3px;position:relative}
.statusbar .batt::after{content:"";position:absolute;left:1.5px;top:1.5px;bottom:1.5px;width:70%;background:#3a3a3a;border-radius:1px}
.header{display:flex;align-items:center;gap:14px;padding:16px 20px 8px}
.backbtn{width:52px;height:52px;border-radius:50%;background:var(--cc-surface);box-shadow:var(--cc-shadow-card);display:flex;align-items:center;justify-content:center;color:var(--cc-text);flex:none}
h1{font-size:28px;font-weight:700;margin:0;line-height:1.2}
.content{padding:12px 20px 28px;display:flex;flex-direction:column;gap:14px}
.row{height:84px;background:var(--cc-surface);border-radius:var(--cc-radius-xl);box-shadow:var(--cc-shadow-card);display:flex;align-items:center;gap:14px;padding:0 16px}
.ricon{width:54px;height:54px;border-radius:14px;display:flex;align-items:center;justify-content:center;flex:none}
.rmid{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.rval{font-size:26px;font-weight:800;line-height:1.15}
.rlabel{font-size:16px;color:var(--cc-text-sub)}
.rtime{font-size:15px;color:var(--cc-text-faint)}
.pill{flex:none;font-size:16px;font-weight:700;padding:10px 16px;border-radius:999px}
.pill.normal{background:var(--cc-success-tint);color:var(--cc-success)}
.pill.high{background:var(--cc-danger-tint);color:var(--cc-danger)}
.pill.border{background:var(--cc-pastel-amber);color:var(--cc-pastel-amber-fg)}
</style>
</head>
<body>
<div class="phone">
  <div class="statusbar">
    <span>9:41</span>
    <span class="dots">
      <span class="dot"></span><span class="dot"></span><span class="dot"></span>
      <span class="batt"></span>
    </span>
  </div>

  <div class="header">
    <div class="backbtn">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
    </div>
    <h1>My Health Readings</h1>
  </div>

  <div class="content">
    <div class="row">
      <div class="ricon" style="background:var(--cc-pastel-red);color:var(--cc-pastel-red-fg)">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
      </div>
      <div class="rmid">
        <div class="rval">120/80</div>
        <div class="rlabel">Blood Pressure</div>
        <div class="rtime">Today 9:41 AM</div>
      </div>
      <div class="pill normal">Normal</div>
    </div>

    <div class="row">
      <div class="ricon" style="background:var(--cc-pastel-amber);color:var(--cc-pastel-amber-fg)">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/></svg>
      </div>
      <div class="rmid">
        <div class="rval">168 mg/dL</div>
        <div class="rlabel">Blood Sugar</div>
        <div class="rtime">Today 7:30 AM</div>
      </div>
      <div class="pill high">High</div>
    </div>

    <div class="row">
      <div class="ricon" style="background:var(--cc-pastel-teal);color:var(--cc-pastel-teal-fg)">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 14.76V3.5a2.5 2.5 0 0 0-5 0v11.26a4.5 4.5 0 1 0 5 0z"/></svg>
      </div>
      <div class="rmid">
        <div class="rval">98.4 °F</div>
        <div class="rlabel">Temperature</div>
        <div class="rtime">Yesterday 8:15 PM</div>
      </div>
      <div class="pill normal">Normal</div>
    </div>

    <div class="row">
      <div class="ricon" style="background:var(--cc-pastel-red);color:var(--cc-pastel-red-fg)">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
      </div>
      <div class="rmid">
        <div class="rval">138/88</div>
        <div class="rlabel">Blood Pressure</div>
        <div class="rtime">Yesterday 9:05 AM</div>
      </div>
      <div class="pill border">Borderline</div>
    </div>

    <div class="row">
      <div class="ricon" style="background:var(--cc-pastel-amber);color:var(--cc-pastel-amber-fg)">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/></svg>
      </div>
      <div class="rmid">
        <div class="rval">112 mg/dL</div>
        <div class="rlabel">Blood Sugar</div>
        <div class="rtime">Tue 8 Jul, 7:45 AM</div>
      </div>
      <div class="pill normal">Normal</div>
    </div>
  </div>
</div>
</body>
</html>
